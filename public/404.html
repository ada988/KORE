<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script>
  // GitHub Pages SPA redirect: encode the path and redirect to /?/path
  // so the app's root can restore client-side routing.
  var seg = 1; // keep /KORE prefix (1 segment)
  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + seg).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(seg).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
</head>
<body></body>
</html>
